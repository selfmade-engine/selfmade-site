<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Copy your Pinterest code</title>
<style>body{font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f6fa;color:#111}
.box{max-width:560px;margin:60px auto;background:#fff;border-radius:14px;padding:28px;border:1px solid #e3e7ee}
code{display:block;font-size:17px;padding:14px;background:#f1f3f7;border-radius:8px;word-break:break-all;margin:14px 0}
button{padding:11px 20px;border-radius:9px;border:0;background:#e60023;color:#fff;font-weight:600;font-size:15px;cursor:pointer}</style></head>
<body><div class="box"><h1>Almost done</h1><p id="msg">Copy this code and paste it into the SELFMADE setup window.</p>
<code id="code">...</code><button id="copy">Copy code</button></div>
<script>
var q = new URLSearchParams(location.search);
var code = q.get('code');
var box = document.getElementById('code');
var button = document.getElementById('copy');
if (code) { box.textContent = code; }
else { box.textContent = q.get('error') ? 'Pinterest said: ' + q.get('error') : 'There is no code here. Start again from the SELFMADE setup window.'; document.getElementById('msg').textContent = 'Something did not work.'; button.hidden = true; }
button.onclick = function () { navigator.clipboard.writeText(code).then(function () { button.textContent = 'Copied'; }); };
</script></body></html>
